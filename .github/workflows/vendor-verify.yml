name: Verify vendored Coordinator

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  vendor:
    name: Clean-clone vendor verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: false
      - name: Rebuild and verify the immutable vendor snapshot
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tools/handoffctl_vendor.py verify --target .
          schema_version="$(python3 -c 'import json; print(json.load(open("coordinator.vendor.json"))["schema_version"])')"
          commit="$(python3 -c 'import json; print(json.load(open("coordinator.vendor.json"))["upstream"]["commit"])')"
          [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]
          upstream="${RUNNER_TEMP}/agent-workflow-coordinator"
          expected="${RUNNER_TEMP}/expected-vendor"
          git clone --no-checkout --filter=blob:none https://github.com/martin-beck/agent-workflow-coordinator.git "${upstream}"
          git -C "${upstream}" fetch --depth=1 origin "${commit}"
          git -C "${upstream}" checkout --detach FETCH_HEAD
          test "$(git -C "${upstream}" rev-parse HEAD)" = "${commit}"
          if [[ "${schema_version}" == "1" ]]; then
            version="$(python3 -c 'import json; print(json.load(open("coordinator.vendor.json"))["upstream"]["version"])')"
            [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            PYTHONDONTWRITEBYTECODE=1 python3 "${upstream}/tools/vendor.py" sync \
              --source "${upstream}" --target "${expected}" --version "${version}"
          elif [[ "${schema_version}" == "2" ]]; then
            channel="$(python3 -c 'import json; print(json.load(open("coordinator.vendor.json"))["upstream"].get("channel", ""))')"
            [[ "${channel}" == "development" ]]
            PYTHONDONTWRITEBYTECODE=1 python3 "${upstream}/tools/vendor.py" sync-development \
              --source "${upstream}" --target "${expected}" --commit "${commit}"
          else
            echo "unsupported vendor manifest schema: ${schema_version}" >&2
            exit 1
          fi
          python3 - "${expected}" <<'PY'
          import filecmp
          import json
          import sys
          from pathlib import Path

          current = Path.cwd()
          expected = Path(sys.argv[1])
          actual_manifest = json.loads((current / "coordinator.vendor.json").read_text())
          expected_manifest = json.loads((expected / "coordinator.vendor.json").read_text())
          assert actual_manifest == expected_manifest
          for relative in actual_manifest["files"]:
              actual = current / relative
              rebuilt = expected / relative
              assert filecmp.cmp(actual, rebuilt, shallow=False), relative
              assert actual.stat().st_mode & 0o777 == rebuilt.stat().st_mode & 0o777, relative
          PY
      - name: Run the offline Coordinator regression suite
        run: |
          uv sync --directory "${RUNNER_TEMP}/agent-workflow-coordinator" --locked --only-group quality
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="${GITHUB_WORKSPACE}" \
            uv run --directory "${RUNNER_TEMP}/agent-workflow-coordinator" --frozen \
            python -m unittest discover -s "${GITHUB_WORKSPACE}/tests" -p 'test_*.py'
      - name: Require a clean checkout after verification
        run: git diff --exit-code && test -z "$(git status --porcelain)"
